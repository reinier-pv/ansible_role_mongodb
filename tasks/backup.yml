---
- name: backup | set host_count if not already defined
  set_fact:
    host_count: "{{ ansible_play_hosts | length }}"
  when: host_count is undefined
  tags: backup

- name: backup | set mongo_primary if not already defined
  set_fact:
    mongo_primary: "{{ mongo_replication_role == 'primary' }}"
  when: mongo_primary is undefined
  tags: backup

- name: backup | set fact for first secondary in play
  set_fact:
    backup_on_host: "{{ item }}"
  loop: "{{ play_hosts }}"
  when:
    - host_count != '1'
    - backup_on_host is undefined
    - hostvars[item].mongo_replication_role == 'secondary'
  run_once: true
  tags: backup

- name: backup | install cronie if not exist
  dnf:
    name: cronie
    state: present
  tags: backup

- name: backup | ensure backup user exists with correct password
  community.mongodb.mongodb_user:
    login_host: localhost
    login_port: "{{ mongo_net.port }}"
    login_database: admin
    login_user: admin
    login_password: "{{ mongo_admin_pass }}"
    database: admin
    name: "{{ mongo_backup.user }}"
    password: "{{ mongo_backup.password }}"
    roles: backup
    state: present
    update_password: always
  tags: backup
  when: >-
    host_count == '1' or
    mongo_primary

- block:
    - name: backup | ensure backup path exists
      file:
        path: "{{ mongo_backup.path }}"
        owner: "{{ mongo_backup.owner }}"
        group: "{{ mongo_backup.group }}"
        mode: "{{ mongo_backup.mode }}"
        state: "directory"
      tags: backup

    - name: backup | set job in cron
      cron:
        name: "{{ item.name }}"
        minute: "{{ mongo_backup.minute }}"
        hour: "{{ mongo_backup.hour }}"
        day: "{{ mongo_backup.day }}"
        job: "{{ item.job }}"
      no_log: true
      loop:
        - name: "remove mongodb old backup files"
          minute: "{{ mongo_backup.minute | int - 1 }}"
          job: "/usr/bin/find {{ mongo_backup.path }}/ -maxdepth 1 -type d
            -mmin +$((60*{{ mongo_backup.retention }})) -exec rm -rf {} \\+"

        - name: "create backup of mongo"
          minute: "{{ mongo_backup.minute }}"
          job: "for dbs in {{ mongo_backup.dbs | join(' ') }} ; do
            mongodump --out
            {{ mongo_backup.path }}/mongo_backup_$(date '+\\%Y-\\%m-\\%d')
            --db $dbs
            --port {{ mongo_net.port }}
            --authenticationDatabase admin
            --username '{{ mongo_backup.user }}'
            --password '{{ mongo_backup.password }}'
            && ln -sf
            {{ mongo_backup.path }}/mongo_backup_$(date '+\\%Y-\\%m-\\%d')
            {{ mongo_backup.path }}/latest ; done"
      tags: backup

  when: >-
    host_count == '1' or
    backup_on_host is defined and inventory_hostname == backup_on_host
